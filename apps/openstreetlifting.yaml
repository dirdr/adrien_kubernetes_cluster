apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openstreetlifting
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Pinned to the release tag, so a chart change on main cannot reach
    # production without a release. Bumped by the release workflow.
    - repoURL: https://github.com/openstreetlifting/openstreetlifting.git
      targetRevision: v0.14.0
      path: charts/
      helm:
        valueFiles:
          - values.yaml
          - $values/helm/openstreetlifting/values-production.yaml
    - repoURL: https://github.com/dirdr/adrien_kubernetes_cluster.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: osl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
