# yamllint disable rule:line-length
environment: staging
frontend:
  image:
    tag: "sha-a79ad4c"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
backend:
  image:
    tag: "sha-87242b1"
  # A SealedSecret is scoped to one namespace, so the production ciphertext
  # cannot be reused here. Nothing reads API_KEYS yet, so staging runs without
  # it until something does.
  existingSecret: ""
  resources:
    limits:
      cpu: 250m
      memory: 128Mi
importer:
  image:
    tag: "sha-87242b1"
  args:
    - competitions
    - ./data/competitions
    - --prune
ingress:
  frontendHost: "staging.openstreetlifting.org"
  backendHost: "api-staging.openstreetlifting.org"
  tls: true
  noindex: true
  basicAuth:
    sealedUsers: 
