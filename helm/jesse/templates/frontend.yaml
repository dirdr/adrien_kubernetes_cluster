apiVersion: apps/v1
kind: Deployment
metadata:
  name: jesse-frontend
  labels:
    app.kubernetes.io/name: jesse-frontend
    app.kubernetes.io/part-of: jesse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jesse-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jesse-frontend
        app.kubernetes.io/part-of: jesse
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jesse-frontend
spec:
  selector:
    app.kubernetes.io/name: jesse-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
