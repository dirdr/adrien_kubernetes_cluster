apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jesse-auth
spec:
  basicAuth:
    secret: {{ .Values.ingress.authSecretName }}
    removeHeader: true
    realm: Jesse
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jesse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ .Values.ingress.certificateResolver }}
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-jesse-auth@kubernetescrd"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jesse-frontend
                port:
                  number: 80
