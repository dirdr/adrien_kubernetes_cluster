    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

imagePullSecrets: []

persistence:
  size: 5Gi
  storageClass: local-path

ingress:
  host: jesse.adrienpelfresne.com
  className: traefik
  certificateResolver: letsencrypt
