backend:
  image:
    repository: ghcr.io/dirdr/jesse-backend
    tag: sha-075d8adb3cb4119a60341864ba1234a71bc64742
  secretName: jesse-env
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  image:
    repository: ghcr.io/dirdr/jesse-frontend
    tag: sha-075d8adb3cb4119a60341864ba1234a71bc64742
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

imagePullSecrets: []

persistence:
  size: 5Gi
  storageClass: local-path

ingress:
  host: jesse.adrienpelfresne.com
  className: traefik
  certificateResolver: letsencrypt
