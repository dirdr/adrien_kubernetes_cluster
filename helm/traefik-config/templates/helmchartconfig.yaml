apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
              # Below the ACME challenge router, so certificate renewal is not
              # redirected away from the web entrypoint.
              priority: 10
    certResolvers:
      letsencrypt:
        email: {{ .Values.acme.email }}
        caServer: {{ .Values.acme.caServer }}
        storage: {{ .Values.acme.storage }}
        httpChallenge:
          entryPoint: web
