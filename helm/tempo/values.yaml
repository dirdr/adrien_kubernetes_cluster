tempo:
  retention: 168h
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      path: /var/tempo/metrics
    registry:
      collection_interval: 15s
      external_labels:
        source: tempo
    processor:
      service_graphs:
        # Keep staging and production separate despite identical service names.
        dimensions:
          - deployment.environment.name
      span_metrics:
        dimensions:
          - deployment.environment.name
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
  storage:
    trace:
      backend: local
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
